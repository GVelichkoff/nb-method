<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NB Method — Треньорски панел</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1B21">
<link rel="icon" type="image/webp" href="images/logo-small.webp">
<link rel="apple-touch-icon" href="images/logo-small.webp">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{
    --ink:#12242B; --paper:#F5F3EE; --card:#FFFFFF; --line:#E4E1D7;
    --petrol:#0F4C5C; --petrol-soft:#E2EDF0;
    --olive:#5F7A3D; --olive-soft:#EAF0DF;
    --amber:#D98E22; --amber-soft:#FBEFDC;
    --gray:#6C7A80; --danger:#B4432E;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Inter','Segoe UI',sans-serif;min-height:100vh}
  .disp{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em}
  header{background:var(--ink);color:#fff;padding:16px 0 14px}
  .hwrap,.shell{max-width:1080px;margin:0 auto;padding:0 16px}
  .hwrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{background:#fff;color:var(--ink);font-weight:700;font-size:15px;padding:6px 10px;border-radius:8px}
  .shell{padding-bottom:60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  h1{font-size:24px;margin:22px 0 4px}
  .sub{color:var(--gray);font-size:14px;margin-bottom:16px}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:10px;font-size:13px;padding:9px 14px}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn.primary{background:var(--petrol);color:#fff}
  .btn.ghost{background:var(--petrol-soft);color:var(--petrol)}
  .btn.olive{background:var(--olive-soft);color:var(--olive)}
  .btn.warn{background:#F7E3DE;color:var(--danger)}
  .btn.small{padding:5px 10px;font-size:12px}
  .empty{padding:24px;text-align:center;color:var(--gray);font-size:14px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  /* login */
  .login{max-width:380px;margin:60px auto;padding:28px}
  .login h1{margin:0 0 4px;font-size:24px}
  .login p{color:var(--gray);font-size:13px;margin-bottom:18px}
  .login label{font-size:12px;font-weight:600;color:var(--gray);display:block;margin:12px 0 4px}
  .login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:14px}
  .login .btn{width:100%;margin-top:18px;padding:13px;font-size:14px}
  /* client list */
  .clientcard{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
  .clientcard:hover{border-color:var(--petrol)}
  .clientcard .nm{font-size:15px;font-weight:600}
  .clientcard .pg{font-size:13px;color:var(--gray);margin-top:2px}
  .badge{background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
  /* tabs */
  .tabs{display:flex;gap:6px;margin:14px 0}
  .tabs .btn{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .tabs .btn.on{background:var(--petrol);color:#fff;border-color:var(--petrol)}
  /* week editor */
  .weekbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select,input[type=text],input[type=number],input[type=time],input[type=url],input[type=datetime-local],textarea{
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;background:var(--card)}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--petrol);border-color:var(--petrol)}
  .day{margin-bottom:14px;padding:16px}
  .dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .dayhead h3{font-size:15px}
  .wo{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:var(--paper)}
  .wohead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
  .wohead strong{font-size:14px;color:var(--petrol)}
  .exrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:center}
  .exrow:last-of-type{border-bottom:none}
  .exrow .nm{font-weight:600}
  .exrow .dt{color:var(--gray)}
  .mealrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
  .mealrow .sl{font-weight:600;color:var(--olive)}
  .addform{display:grid;gap:6px;margin-top:8px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--card)}
  .addform .row{display:flex;gap:6px;flex-wrap:wrap}
  .addform input,.addform select{flex:1;min-width:90px}
  .x{background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px;padding:2px 6px}
  /* chat */
  .chatbox{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:300px;max-height:55vh;overflow-y:auto}
  .msg{max-width:82%}
  .msg .bubble{padding:10px 14px;font-size:14px;line-height:1.45;word-wrap:break-word}
  .msg.other{align-self:flex-start}
  .msg.other .bubble{background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px}
  .msg.me{align-self:flex-end}
  .msg.me .bubble{background:var(--petrol);color:#fff;border-radius:14px 14px 4px 14px}
  .msg .meta{font-size:11px;color:var(--gray);margin-top:3px}
  .msg.me .meta{text-align:right}
  .chatrow{display:flex;gap:8px;margin-top:10px}
  .chatrow input{flex:1}
  /* calls */
  .callrow{padding:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:8px;align-items:center}
  .logout{background:none;border:none;color:#fff;opacity:.6;font-size:12px;cursor:pointer;font-family:inherit}
  .vframe{margin:14px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000}
  .vframe-inner{height:70vh;min-height:420px}
  .vclose{width:100%;background:var(--ink);color:#fff;padding:12px;font-size:13px;border-radius:0}
  .back{background:none;border:none;color:var(--petrol);font-weight:600;cursor:pointer;font-size:13px;font-family:inherit;padding:0;margin-top:18px}
  section[hidden],div[hidden]{display:none}

  /* ============ ТЪМНА БРАНД ТЕМА (NB Method) ============ */
  :root{--orange:#F97316}
  body{background:#0D1B21;color:#F0EDE4}
  header{background:#0A1A20}
  .card{background:#112B34;border-color:#24424D}
  .sub,.clientcard .pg,.empty,.msg .meta,.exrow .dt{color:#9FB0B5}
  select,input,textarea{background:#0E222A !important;border-color:#2A4652 !important;color:#F0EDE4 !important}
  input::placeholder{color:#7E939A}
  .login p,.login label{color:#9FB0B5}
  .err{color:#FFB4A0}
  .btn.primary{background:var(--orange)}
  .btn.ghost{background:rgba(237,106,47,.16);color:#FFA65C}
  .btn.olive{background:rgba(169,199,125,.16);color:#B9D48A}
  .btn.warn{background:rgba(255,140,110,.15);color:#FFB4A0}
  .clientcard:hover{border-color:var(--orange)}
  .tabs .btn{background:#112B34;color:#F0EDE4;border-color:#24424D}
  .tabs .btn.on{background:var(--orange);border-color:var(--orange)}
  .wo{background:#0E222A;border-color:#24424D}
  .wo[style*="olive-soft"]{background:#15251A!important;border-color:#2C4A38!important}
  .wohead strong{color:#FFA65C}
  .wohead strong[style*="--olive"]{color:#B9D48A!important}
  .exrow{border-bottom-color:#24424D}
  .addform{border-color:#2A4652;background:#0E222A}
  .msg.other .bubble{background:#0E222A;border-color:#2A4652}
  .msg.me .bubble{background:#0F4C5C}
  .pill[style*="amber-soft"]{background:#3D2C12!important;color:#FFA65C!important}
  .pill[style*="olive-soft"]{background:#22331B!important;color:#B9D48A!important}
  .pill[style*="#eee"]{background:#24333A!important;color:#9FB0B5!important}
  .back{color:#FFA65C}
  .callrow a{color:#FFA65C}
  .btn.primary,.tabs .btn.on{color:#FFFFFF !important}
  .coach-note{margin:10px 0 14px;padding:12px 14px;border:1px solid #2A4652;border-left:4px solid var(--orange);border-radius:10px;background:#0E222A;color:#B9C6CA;font-size:12.5px;line-height:1.55}
  .coach-note strong{color:#fff}

  /* ============ METHOD CATEGORIES ============ */
  .category-overview{
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0 18px
  }
  .category-filter{
    background:#112B34;border:1px solid #24424D;border-radius:12px;padding:12px 10px;
    color:#F0EDE4;cursor:pointer;text-align:left;font-family:inherit;transition:.15s
  }
  .category-filter:hover{border-color:#4B6570;transform:translateY(-1px)}
  .category-filter.on{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
  .category-filter .cat-name{display:block;font-size:11px;font-weight:700;letter-spacing:.08em}
  .category-filter .cat-count{display:block;font-size:22px;font-weight:700;margin-top:3px}
  .category-filter .cat-sub{display:block;color:#8EA2A9;font-size:10.5px;margin-top:2px}
  .category-filter[data-cat="EVERYDAY"] .cat-name,.cat-pill.everyday{color:#7FC6D8}
  .category-filter[data-cat="ADAPT"] .cat-name,.cat-pill.adapt{color:#B9D48A}
  .category-filter[data-cat="PERFORMANCE"] .cat-name,.cat-pill.performance{color:#FFA65C}
  .category-filter[data-cat="ELITE"] .cat-name,.cat-pill.elite{color:#D7B6FF}

  .category-warning{
    margin:10px 0 16px;padding:12px 14px;border-radius:10px;
    border:1px solid #6B4A22;background:#2F2418;color:#F6C98B;font-size:12.5px;line-height:1.5
  }
  .client-group{margin:18px 0 24px}
  .client-group-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:8px}
  .client-group-title{font-size:15px;font-weight:700}
  .client-group-desc{font-size:11px;color:#8EA2A9;margin-top:2px}
  .client-group-count{font-size:12px;color:#9FB0B5}
  .cat-pill{
    display:inline-block;border:1px solid #31505C;background:#0E222A;border-radius:999px;
    padding:3px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;vertical-align:1px
  }
  .client-category-edit{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 4px
  }
  .client-category-edit label{font-size:11px;color:#8EA2A9;font-weight:700;letter-spacing:.08em}
  .client-category-edit select{min-width:180px}
  @media (max-width:760px){
    .category-overview{grid-template-columns:repeat(2,minmax(0,1fr))}
    .category-overview .category-filter:first-child{grid-column:1/-1}
  }

  /* ===== LOGO SAFETY ===== */
  .brand{display:inline-flex;align-items:center;max-width:100%;text-decoration:none}
  .brand img{display:block;width:auto;height:42px;max-width:180px;object-fit:contain}
  .login .brand{justify-content:center;width:100%;margin-bottom:14px}
  .login .brand img{height:auto;max-height:76px;max-width:240px}
  @media(max-width:520px){
    .brand img{height:36px;max-width:150px}
    .login .brand img{height:auto;max-height:68px;max-width:210px}
  }

</style>
</head>
<body>

<div id="screen-login">
  <div class="card login">
    <a class="brand disp" href="app.html"><img src="images/logo-big.webp" /></a>
    <p>Треньорски панел</p>
    <label for="email">Имейл</label>
    <input id="email" type="email" autocomplete="email">
    <label for="pass">Парола</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="btn primary" onclick="login()">Вход</button>
    <div class="err" id="loginerr"></div>
  </div>
</div>

<div id="screen-app" hidden>
<header>
  <div class="hwrap">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <a class="brand disp" href="app.html"><img src="images/logo-big.webp" alt="NB Method" /></a>
      <div id="username" style="font-size:12px;color:#9FB0B5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
    </div>
    <button class="logout" onclick="changePass()">Смяна на парола</button>
    <button class="logout" onclick="logout()">Изход</button>
  </div>
</header>

<main class="shell">

  <!-- СПИСЪК КЛИЕНТИ -->
  <div id="view-list">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><h1 class="disp">Клиенти</h1><p class="sub" id="list-sub"></p></div>
      <button class="btn primary" onclick="toggle('addclient')">＋ Добави клиент</button>
    </div>
    <div class="category-overview" id="category-filters">
      <button class="category-filter on" data-cat="ALL" onclick="setCategoryFilter('ALL')">
        <span class="cat-name disp">Всички</span><span class="cat-count" id="cat-count-ALL">0</span><span class="cat-sub">активни клиенти</span>
      </button>
      <button class="category-filter" data-cat="EVERYDAY" onclick="setCategoryFilter('EVERYDAY')">
        <span class="cat-name disp">Everyday</span><span class="cat-count" id="cat-count-EVERYDAY">0</span><span class="cat-sub">general fitness</span>
      </button>
      <button class="category-filter" data-cat="ADAPT" onclick="setCategoryFilter('ADAPT')">
        <span class="cat-name disp">Adapt</span><span class="cat-count" id="cat-count-ADAPT">0</span><span class="cat-sub">adapted training</span>
      </button>
      <button class="category-filter" data-cat="PERFORMANCE" onclick="setCategoryFilter('PERFORMANCE')">
        <span class="cat-name disp">Performance</span><span class="cat-count" id="cat-count-PERFORMANCE">0</span><span class="cat-sub">advanced & competitive</span>
      </button>
      <button class="category-filter" data-cat="ELITE" onclick="setCategoryFilter('ELITE')">
        <span class="cat-name disp">Elite</span><span class="cat-count" id="cat-count-ELITE">0</span><span class="cat-sub">professional athletes</span>
      </button>
    </div>
    <div class="category-warning" id="category-db-warning" hidden>
      За постоянно записване на категориите е нужна колоната <strong>method_category</strong> в Supabase.
      Приложи приложения SQL migration файл веднъж. Дотогава панелът ще използва временно автоматично разпознаване.
    </div>
    <div class="card addform" id="addclient" hidden>
      <div class="row">
        <input type="text" id="ac-name" placeholder="Име и фамилия на клиента">
        <input type="email" id="ac-email" placeholder="Имейл на клиента (акаунтът трябва да съществува)">
      </div>
      <div class="row">
        <input type="text" id="ac-program" placeholder="Основна цел / програма, напр. сила, редукция, връщане към движение" style="flex:1">
      </div>
      <div class="row">
        <input type="number" id="ac-kcal" placeholder="Цел ккал/ден (по избор)">
        <input type="number" id="ac-protein" placeholder="Цел протеин г/ден (по избор)">
      </div>
      <div class="row">
        <select id="ac-category" style="flex:1">
          <option value="EVERYDAY">EVERYDAY — общ фитнес / трансформация</option>
          <option value="ADAPT">ADAPT — адаптирано трениране</option>
          <option value="PERFORMANCE">PERFORMANCE — напреднали / състезатели</option>
          <option value="ELITE">ELITE — професионални спортисти</option>
        </select>
      </div>
      <div class="row">
        <select id="ac-gender" style="flex:1">
          <option value="">Пол (по избор)</option>
          <option value="female">Жена</option>
          <option value="male">Мъж</option>
          <option value="other">Друго / без значение</option>
        </select>
        <select id="ac-sub" style="flex:1">
          <option value="">Тип абонамент (по избор)</option>
          <option value="Старт">Старт</option>
          <option value="Insider">Insider</option>
          <option value="Total 1:1">Total 1:1</option>
        </select>
      </div>
      <div class="row">
        <input type="text" id="ac-health" placeholder="Специална здравословна програма — опиши състоянието или остави празно" style="flex:1">
        <button class="btn primary" onclick="addClient()">Добави</button>
      </div>
      <div class="err" id="ac-err"></div>
    </div>
    <div id="clients"></div>
  </div>

  <!-- ДЕТАЙЛ КЛИЕНТ -->
  <div id="view-client" hidden>
    <button class="back" onclick="backToList()">← Всички клиенти</button>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h1 class="disp" id="cl-name" style="margin-bottom:0"></h1>
      <button class="btn ghost" type="button" onclick="editClientName()" title="Промени името на клиента">✎ Промени име</button>
    </div>
    <p class="sub" id="cl-sub"></p>
    <div class="client-category-edit">
      <label class="disp" for="cl-category">Method category</label>
      <select id="cl-category">
        <option value="EVERYDAY">EVERYDAY</option>
        <option value="ADAPT">ADAPT</option>
        <option value="PERFORMANCE">PERFORMANCE</option>
        <option value="ELITE">ELITE</option>
      </select>
      <button class="btn ghost small" type="button" onclick="saveClientCategory()">Запази категория</button>
    </div>
    <div class="coach-note" id="category-note"></div>
    <div class="tabs">
      <button class="btn on" data-tab="weeks" onclick="ctab('weeks')">Седмици</button>
      <button class="btn" data-tab="chat" onclick="ctab('chat')">Чат</button>
      <button class="btn" data-tab="calls" onclick="ctab('calls')">Разговори</button>
      <button class="btn" data-tab="progress" onclick="ctab('progress')">Прогрес & check-in</button>
    </div>

    <!-- Седмици -->
    <div id="ctab-weeks">
      <div class="weekbar">
        <select id="weeksel" onchange="pickWeek(this.value)"></select>
        <button class="btn ghost" onclick="newWeek(false)">＋ Нова празна седмица</button>
        <button class="btn ghost" onclick="newWeek(true)">⧉ Нова седмица (копие на последната)</button>
        <button class="btn warn" onclick="delWeek()">✕ Изтрий седмицата</button>
      </div>
      <div style="margin-bottom:10px">
        <button class="btn olive small" onclick="toggle('newfood')">＋ Нова храна в списъка</button>
      </div>
      <div class="card addform" id="newfood" hidden style="margin-bottom:14px">
        <div class="row">
          <input type="text" id="nf-name" placeholder="Име, напр. Киноа (суров)">
          <select id="nf-piece" style="max-width:130px">
            <option value="100g">на 100 г</option>
            <option value="piece">на брой/доза</option>
          </select>
          <input type="number" step="0.1" id="nf-kcal" placeholder="ккал" style="max-width:80px">
        </div>
        <div class="row">
          <input type="number" step="0.01" id="nf-carbs" placeholder="Въгл. г" style="max-width:90px">
          <input type="number" step="0.01" id="nf-fiber" placeholder="Фибри г" style="max-width:90px">
          <input type="number" step="0.01" id="nf-fat" placeholder="Мазн. г" style="max-width:90px">
          <input type="number" step="0.01" id="nf-prot" placeholder="Прот. г" style="max-width:90px">
          <button class="btn primary small" onclick="saveFood()">Запази храната</button>
        </div>
      </div>
      <datalist id="foodlist"></datalist>
      <div class="card addform" style="margin-bottom:14px">
        <div class="row">
          <input type="text" id="wknotes" placeholder="Фокус / адаптации за седмицата (клиентът ги вижда)">
          <button class="btn olive" onclick="saveNotes()">Запази бележките</button>
        </div>
      </div>
      <div id="days"></div>
    </div>

    <!-- Чат -->
    <div id="ctab-chat" hidden>
      <div class="card chatbox" id="chatbox"></div>
      <div class="chatrow">
        <input id="chatin" placeholder="Напиши съобщение…" aria-label="Съобщение">
        <button class="btn primary" onclick="sendMsg()">Изпрати</button>
      </div>
    </div>

    <!-- Разговори -->
    <div id="ctab-calls" hidden>
      <div class="card callrow" style="border-left:4px solid var(--amber)">
        <span><strong>Видео стая с клиента</strong> — обща за вас двамата, винаги отворена.</span>
        <button class="btn primary" onclick="startCall()">▶ Влез във видео стаята</button>
      </div>
      <div class="vframe" id="vframe" hidden>
        <div class="vframe-inner" id="vframe-inner"></div>
        <button class="btn vclose" onclick="endCall()">Затвори видео разговора</button>
      </div>

const SUPABASE_URL = "https://ncajmvrwueobqbiebphm.supabase.co";

const METHOD_CATEGORIES = {

let categoryFilter = "ALL";

function normalizeCategory(value){
  const v = String(value || "").trim().toUpperCase();
  return METHOD_CATEGORIES[v] ? v : null;
}

function programCategory(p){
  const saved = normalizeCategory(p?.method_category);
  if (saved) return saved;

  // Временен fallback за бази, в които migration-ът още не е приложен.
  if (p?.special_health_program) return "ADAPT";
  const hay = `${p?.program_name || ""} ${p?.subscription_type || ""}`.toLowerCase();
  if (/\belite\b|професионал|professional/.test(hay)) return "ELITE";
  if (/performance|състез|атлет|athlete|спорт|sport/.test(hay)) return "PERFORMANCE";
  return "EVERYDAY";
}

function categoryClass(cat){ return String(cat || "EVERYDAY").toLowerCase(); }

function categoryPill(cat){
  return `<span class="cat-pill ${categoryClass(cat)}">${esc(cat)}</span>`;
}

async function checkCategorySupport(){
  const { error } = await sb.from("nb_client_programs").select("method_category").limit(1);

}

function setCategoryFilter(cat){
  categoryFilter = cat;

}

function renderCategoryFilters(){
  const counts = { ALL: programs.length, EVERYDAY:0, ADAPT:0, PERFORMANCE:0, ELITE:0 };
  programs.forEach(p => counts[programCategory(p)]++);

    const el = document.getElementById("cat-count-" + cat);

    `${programs.length} активни програми · ${counts.EVERYDAY} Everyday · ${counts.ADAPT} Adapt · ${counts.PERFORMANCE} Performance · ${counts.ELITE} Elite`;
}

        <div class="pg">${esc(p.program_name)} · Седмица ${p.current_week} · ${p.status === "active" ? "активна" : esc(p.status)}</div>

          ${p.special_health_program ? `<span style="font-size:11px;color:#FFA65C">⚕️ ${esc(p.special_health_program)}</span>` : ""}
        </div>
      </div>
      ${unread[p.id] ? `<span class="badge">${unread[p.id]} ново</span>` : ""}

}

function renderClientList(){
  const holder = document.getElementById("clients");
  if (!programs.length) {
    holder.innerHTML = `<div class="card empty">Още нямаш клиенти — добави първия с бутона горе.</div>`;
    return;
  }

  const cats = categoryFilter === "ALL"
    ? ["EVERYDAY","ADAPT","PERFORMANCE","ELITE"]
    : [categoryFilter];

  const html = cats.map(cat => {
    const list = programs.filter(p => programCategory(p) === cat);
    if (!list.length && categoryFilter === "ALL") return "";
    const meta = METHOD_CATEGORIES[cat];
    return `<div class="client-group">
      <div class="client-group-head">
        <div>
          <div class="client-group-title disp">${categoryPill(cat)} ${esc(meta.label)}</div>

  }).join("");

  holder.innerHTML = html || `<div class="card empty">Няма клиенти в тази категория.</div>`;

async function setClientName(clientId, fullName){
  const cleanName = (fullName || "").trim();
  if (!clientId || cleanName.length < 2) {
    return { ok:false, error:"Въведи валидно име на клиента." };
  }

  // Първо опитваме директно обновяване. Ако RLS не позволява на треньора
  // да редактира nb_profiles, използваме защитената RPC функция от
  // supabase-client-name-fix.sql.
  const direct = await sb.from("nb_profiles")
    .update({ full_name: cleanName })
    .eq("id", clientId)
    .select("id");

  if (!direct.error && direct.data && direct.data.length) return { ok:true };

  const viaRpc = await sb.rpc("nb_set_client_name", {
    p_client_id: clientId,
    p_full_name: cleanName,
  });
  if (!viaRpc.error) return { ok:true };

  return {
    ok:false,
    error: viaRpc.error.message || direct.error?.message || "Името не можа да бъде записано."
  };
}

async function addClient(){
  const err = document.getElementById("ac-err"); err.textContent = "";
  const name = document.getElementById("ac-name").value.trim();
  const email = document.getElementById("ac-email").value.trim();
  const prog = document.getElementById("ac-program").value.trim();
  if (!name || !email || !prog) {
    err.textContent = "Име, имейл и основна цел / програма са задължителни.";
    return;
  }
  if (name.length < 2) { err.textContent = "Въведи валидно име на клиента."; return; }

  // Запомняме съществуващите програми, за да намерим точно новосъздадената.
  const beforeIds = new Set(programs.map(p => p.id));
  const category = normalizeCategory(document.getElementById("ac-category").value) || "EVERYDAY";
  const gender = document.getElementById("ac-gender").value || null;
  const sub = document.getElementById("ac-sub").value || null;
  const health = document.getElementById("ac-health").value.trim() || null;
  const { error } = await sb.rpc("nb_add_client", {
    p_email: email, p_program: prog,
    p_kcal: parseInt(document.getElementById("ac-kcal").value) || null,
    p_protein: parseInt(document.getElementById("ac-protein").value) || null,
    p_gender: gender,
    p_subscription: sub,
    p_health: health,
  });
  if (error) { err.textContent = error.message; return; }

  const after = await sb.from("nb_client_programs")
    .select("id,client_id")
    .eq("coach_id", me.id);
  const created = (after.data || []).find(p => !beforeIds.has(p.id));

  if (created?.client_id) {
    if (hasCategoryColumn) {
      const categorySave = await sb.from("nb_client_programs")
        .update({ method_category: category })
        .eq("id", created.id);
      if (categorySave.error) {
        console.warn("Method category was not saved:", categorySave.error.message);
      }
    }

    const rename = await setClientName(created.client_id, name);
    if (!rename.ok) {
      await loadClients();
      err.textContent = "Клиентът е добавен, но името не беше записано: " + rename.error +
        " Пусни файла supabase-client-name-fix.sql веднъж в Supabase SQL Editor.";
      return;
    }
  } else {
    await loadClients();
    err.textContent = "Клиентът е добавен, но не успях да открия новата програма, за да запиша името. Обнови страницата и използвай „Промени име“ в профила му.";
    return;
  }

  document.getElementById("addclient").hidden = true;
  ["ac-name","ac-email","ac-program","ac-kcal","ac-protein","ac-gender","ac-sub","ac-health"].forEach(i => document.getElementById(i).value = "");
  document.getElementById("ac-category").value = "EVERYDAY";
  await loadClients();
  if (!hasCategoryColumn && category !== "EVERYDAY") {
    alert("Клиентът е добавен, но избраната Method категория няма да се запази постоянно, докато не приложиш nb_method_category_migration.sql в Supabase.");
  }
}

async function newWeek(copy){
  const last = weeks[0] || null;
  const num = last ? last.week_number + 1 : 1;
  const start = last
    ? new Date(new Date(last.week_start + "T00:00:00").getTime() + 7 * 864e5)
    : (() => { const d = new Date(); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; })();
  const p2 = n => String(n).padStart(2, "0");
  const startStr = start.getFullYear() + "-" + p2(start.getMonth() + 1) + "-" + p2(start.getDate());

  const { data: np, error } = await sb.from("nb_weekly_plans")
    .insert({ program_id: cur.id, week_number: num, week_start: startStr }).select().single();
  if (error) { alert(error.message); return; }

  if (copy && last) {
    // копирай тренировки + упражнения
    const { data: lw } = await sb.from("nb_workouts").select("*").eq("weekly_plan_id", last.id);
    for (const w of (lw || [])) {
      const { data: nw } = await sb.from("nb_workouts").insert({
        weekly_plan_id: np.id, day_of_week: w.day_of_week, title: w.title,
        workout_type: w.workout_type, est_minutes: w.est_minutes,
      }).select().single();
      const { data: lex } = await sb.from("nb_workout_exercises").select("*").eq("workout_id", w.id).order("position");
      if (lex?.length) {
        await sb.from("nb_workout_exercises").insert(lex.map(e => ({
          workout_id: nw.id, position: e.position, name: e.name, sets_reps: e.sets_reps,
          rest_seconds: e.rest_seconds, coach_note: e.coach_note, why_note: e.why_note,
          demo_video_url: e.demo_video_url,
        })));
      }
    }
    // копирай меню
    const { data: lm } = await sb.from("nb_meals").select("*").eq("weekly_plan_id", last.id);
    if (lm?.length) {
      await sb.from("nb_meals").insert(lm.map(m => ({
        weekly_plan_id: np.id, day_of_week: m.day_of_week, meal_slot: m.meal_slot,
        meal_time: m.meal_time, description: m.description, kcal: m.kcal, protein_g: m.protein_g,
      })));
    }
  }

  await sb.from("nb_client_programs").update({ current_week: num }).eq("id", cur.id);
  cur.current_week = num;
  await loadWeeks();
}

async function delWeek(){
  if (!wk) return;
  const ok = confirm(
    `Изтриване на Седмица ${wk.week_number} (от ${wk.week_start})?\n\n` +
    `Ще се изтрият ВСИЧКИ нейни тренировки, упражнения и менюта.\n` +
    `Клиентът ще спре да я вижда. Действието е необратимо.`
  );
  if (!ok) return;
  const { error } = await sb.from("nb_weekly_plans").delete().eq("id", wk.id);
  if (error) { alert(error.message); return; }
  const { data: rest } = await sb.from("nb_weekly_plans")
    .select("week_number").eq("program_id", cur.id)
    .order("week_number", { ascending: false }).limit(1);
  const top = rest?.[0]?.week_number || 0;
  if (cur.current_week > top) {
    await sb.from("nb_client_programs").update({ current_week: Math.max(top, 1) }).eq("id", cur.id);
    cur.current_week = Math.max(top, 1);
  }
  await loadWeeks();
}

/* ---------------- CRUD ---------------- */
async function addWorkout(dow){
  const title = document.getElementById("wt-" + dow).value.trim();
  if (!title) return;
  const { error } = await sb.from("nb_workouts").insert({
    weekly_plan_id: wk.id, day_of_week: dow, title,
    workout_type: document.getElementById("wy-" + dow).value,
    est_minutes: parseInt(document.getElementById("wm-" + dow).value) || null,
  });
  if (error) { alert(error.message); return; }
  pickWeek(wk.id);
}
async function delWorkout(id){
  if (!confirm("Изтриване на тренировката и всичките ѝ упражнения?")) return;
  await sb.from("nb_workouts").delete().eq("id", id);
  pickWeek(wk.id);
}
async function addEx(wid){
  const name = document.getElementById("en-" + wid).value.trim();
  const sets = document.getElementById("es-" + wid).value.trim();
  if (!name || !sets) return;
  let videoUrl = document.getElementById("ev-" + wid).value.trim() || null;

  const fileEl = document.getElementById("ef-" + wid);
  if (fileEl && fileEl.files.length) {
    const f = fileEl.files[0];
    if (f.size > 60 * 1024 * 1024) { alert("Клипът е над 60 MB — компресирай го първо."); return; }
    const ext = f.name.split(".").pop().toLowerCase();
    const path = "ex-" + crypto.randomUUID() + "." + ext;
    const { error: upErr } = await sb.storage.from("videos").upload(path, f);
    if (upErr) { alert("Качването се провали: " + upErr.message); return; }
    videoUrl = sb.storage.from("videos").getPublicUrl(path).data.publicUrl;
  }

  const pos = exercises.filter(e => e.workout_id === wid).length + 1;
  const { error } = await sb.from("nb_workout_exercises").insert({
    workout_id: wid, position: pos, name, sets_reps: sets,
    rest_seconds: parseInt(document.getElementById("er-" + wid).value) || null,
    coach_note: document.getElementById("ec-" + wid).value.trim() || null,
    why_note: document.getElementById("ew-" + wid).value.trim() || null,
    demo_video_url: videoUrl,
  });
  if (error) { alert(error.message); return; }
  pickWeek(wk.id);
}
async function delEx(id){
  await sb.from("nb_workout_exercises").delete().eq("id", id);
  pickWeek(wk.id);
}
async function addMeal(dow){
  const slot = document.getElementById("ms-" + dow).value.trim().toLowerCase();
  if (!slot) { alert("Напиши какво е храненето (закуска, обяд…)"); return; }
  let mealLink = document.getElementById("mlk-" + dow).value.trim() || null;
  const mFile = document.getElementById("mvf-" + dow);
  if (mFile && mFile.files.length) {
    const f = mFile.files[0];
    if (f.size > 60 * 1024 * 1024) { alert("Клипът е над 60 MB — компресирай го първо."); return; }
    const ext = f.name.split(".").pop().toLowerCase();
    const path = "meal-" + crypto.randomUUID() + "." + ext;
    const { error: upErr } = await sb.storage.from("videos").upload(path, f);
    if (upErr) { alert("Качването се провали: " + upErr.message); return; }
    mealLink = sb.storage.from("videos").getPublicUrl(path).data.publicUrl;
  }
  const { error } = await sb.from("nb_meals").insert({
    weekly_plan_id: wk.id, day_of_week: dow,
    meal_slot: slot,
    meal_time: document.getElementById("mt-" + dow).value || null,
    description: document.getElementById("md-" + dow).value.trim() || null,
    link_url: mealLink,
    kcal: parseInt(document.getElementById("mk-" + dow).value) || null,
    protein_g: parseInt(document.getElementById("mp-" + dow).value) || null,
  });
  if (error) { alert(error.message); return; }
  pickWeek(wk.id);
}

async function addItem(mealId){
  const name = document.getElementById("in-" + mealId).value.trim();
  if (!name) return;
  const num = id => { const v = document.getElementById(id + "-" + mealId).value; return v === "" ? null : parseFloat(v); };
  const pos = mealItems.filter(i => i.meal_id === mealId).length + 1;
  const { error } = await sb.from("nb_meal_items").insert({
    meal_id: mealId, position: pos, name,
    grams: num("ig"), kcal: num("ik"), carbs_g: num("ic"),
    fiber_g: num("if"), fat_g: num("im"), protein_g: num("ip"),
  });
  if (error) { alert(error.message); return; }
  await syncMealTotals(mealId, name);
  pickWeek(wk.id);
}
async function delItem(id, mealId){
  await sb.from("nb_meal_items").delete().eq("id", id);
  await syncMealTotals(mealId);
  pickWeek(wk.id);
}
async function syncMealTotals(mealId){
  const { data: its } = await sb.from("nb_meal_items").select("kcal,protein_g,name").eq("meal_id", mealId);
  const kcal = Math.round((its || []).reduce((s,i)=>s+(+i.kcal||0),0)) || null;
  const prot = Math.round((its || []).reduce((s,i)=>s+(+i.protein_g||0),0)) || null;
  const desc = (its || []).map(i=>i.name).join(", ") || null;
  await sb.from("nb_meals").update({ kcal, protein_g: prot, description: desc }).eq("id", mealId);
}
async function delMeal(id){
  await sb.from("nb_meals").delete().eq("id", id);
  pickWeek(wk.id);
}

async function sendMsg(){

function subscribeChat(){

    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "nb_messages", filter: "program_id=eq." + cur.id },
      payload => { msgs.push(payload.new); renderChat(); if (!document.getElementById("ctab-chat").hidden) markRead(); })
    .subscribe();
}
async function markRead(){

/* ---------------- ХРАНИ (автоматични макроси) ---------------- */
async function loadFoods(){
  const { data } = await sb.from("nb_foods").select("*").order("name");
  FOODS = data || [];
  document.getElementById("foodlist").innerHTML =
    FOODS.map(f => `<option value="${esc(f.name)}">`).join("");
}
function findFood(name){
  const n = (name || "").trim().toLowerCase();
  return FOODS.find(f => f.name.toLowerCase() === n) || null;
}
function autoFill(mealId){
  const food = findFood(document.getElementById("in-" + mealId).value);
  if (!food) return;
  const gEl = document.getElementById("ig-" + mealId);
  let factor;
  if (food.per_piece) {
    const qty = parseFloat(gEl.value);
    factor = (isNaN(qty) || qty <= 0) ? 1 : qty;
  } else {
    const grams = parseFloat(gEl.value);
    if (isNaN(grams) || grams <= 0) return;
    factor = grams / 100;
  }
  const r1 = v => v == null ? "" : Math.round(v * factor * 10) / 10;
  document.getElementById("ik-" + mealId).value = r1(food.kcal);
  document.getElementById("ic-" + mealId).value = r1(food.carbs_g);
  document.getElementById("if-" + mealId).value = r1(food.fiber_g);
  document.getElementById("im-" + mealId).value = r1(food.fat_g);
  document.getElementById("ip-" + mealId).value = r1(food.protein_g);
}
async function saveFood(){
  const name = document.getElementById("nf-name").value.trim();
  if (!name) { alert("Име на храната?"); return; }
  const num = id => { const v = document.getElementById(id).value; return v === "" ? null : parseFloat(v); };
  const kcal = num("nf-kcal");
  if (kcal == null) { alert("Калориите са задължителни."); return; }
  const { error } = await sb.from("nb_foods").upsert({
    name, kcal,
    carbs_g: num("nf-carbs"), fiber_g: num("nf-fiber"),
    fat_g: num("nf-fat"), protein_g: num("nf-prot"),
    per_piece: document.getElementById("nf-piece").value === "piece",
  }, { onConflict: "name" });
  if (error) { alert(error.message); return; }
  ["nf-name","nf-kcal","nf-carbs","nf-fiber","nf-fat","nf-prot"].forEach(i => document.getElementById(i).value = "");
  document.getElementById("newfood").hidden = true;
  await loadFoods();
}

      return `<div class="exrow"><span style="${grid}">
        <b>${new Date(p.logged_at).toLocaleDateString("bg-BG",{day:"numeric",month:"short"})}</b>
        <span>${f(p.weight_kg)}${arrow}</span><span>${f(p.waist_cm)}</span><span>${f(p.chest_cm)}</span>
        <span>${f(p.hips_cm)}</span><span>${f(p.thigh_cm)}</span><span>${f(p.arm_cm)}</span></span></div>`;
    }).join("")
    : `<div class="empty">Клиентът още не е записал мерки.</div>`);
}

/* ---------------- ВГРАДЕНО ВИДЕО (Jitsi) ---------------- */
let jitsiApi = null;
async function ensureJitsi(){
  if (window.JitsiMeetExternalAPI) return;
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://meet.jit.si/external_api.js";
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function startCall(){
  if (!cur) return;
  if (jitsiApi) { endCall(); }
  await ensureJitsi();
  document.getElementById("vframe").hidden = false;
  jitsiApi = new JitsiMeetExternalAPI("meet.jit.si", {
    roomName: "NBMethod-" + cur.id,
    parentNode: document.getElementById("vframe-inner"),
    userInfo: { displayName: me.full_name },
    configOverwrite: { prejoinConfig: { enabled: false }, defaultLanguage: "bg" },
  });
}
function endCall(){
  if (jitsiApi) { jitsiApi.dispose(); jitsiApi = null; }
  document.getElementById("vframe").hidden = true;
  document.getElementById("vframe-inner").innerHTML = "";
}

/* ---------------- НАВИЦИ (треньор) ---------------- */
async function loadClientHabits(){
  const { data } = await sb.from("nb_habits").select("*")
    .eq("program_id", cur.id).eq("active", true).order("created_at");
  const hs = data || [];
  let logs = [];
  if (hs.length) {
    const since = new Date(); since.setDate(since.getDate() - 7);
    const p = n => String(n).padStart(2,"0");
    const ds = since.getFullYear()+"-"+p(since.getMonth()+1)+"-"+p(since.getDate());
    const { data: l } = await sb.from("nb_habit_logs").select("*")
      .in("habit_id", hs.map(x => x.id)).gte("day", ds).eq("done", true);
    logs = l || [];
  }
  document.getElementById("cl-habits").innerHTML = hs.length ? hs.map(h => {
    const cnt = logs.filter(l => l.habit_id === h.id).length;
    return `<div class="exrow">
      <span>${h.icon || "✅"} <b>${esc(h.title)}</b> · <span style="color:#9FB0B5">${cnt}/7 дни тази седмица</span></span>
      <button class="x" title="Премахни" onclick="delHabit('${h.id}')">✕</button>
    </div>`;
  }).join("") : `<div class="empty">Няма зададени навици — добави първия с формата горе.</div>`;
}
async function addHabit(){
  const title = document.getElementById("hb-title").value.trim();
  if (!title) return;
  const { error } = await sb.from("nb_habits").insert({
    program_id: cur.id, title,
    icon: document.getElementById("hb-icon").value.trim() || "✅",
  });
  if (error) { alert(error.message); return; }
  document.getElementById("hb-title").value = "";
  loadClientHabits();
}
async function delHabit(id){
  if (!confirm("Премахване на навика? Историята му също се трие.")) return;
  await sb.from("nb_habits").delete().eq("id", id);
  loadClientHabits();
}

/* ---------------- СМЯНА НА ПАРОЛА ---------------- */
async function changePass(){
  const p1 = prompt("Нова парола (минимум 8 знака):");
  if (p1 === null) return;
  if (p1.length < 8) { alert("Паролата трябва да е поне 8 знака."); return; }
  const p2 = prompt("Повтори новата парола:");
  if (p1 !== p2) { alert("Паролите не съвпадат."); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  alert(error ? "Грешка: " + error.message : "Паролата е сменена успешно ✓");
}
