<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NB Method</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1B21">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#12242B; --paper:#F5F3EE; --card:#FFFFFF; --line:#E4E1D7;
    --petrol:#0F4C5C; --petrol-soft:#E2EDF0;
    --olive:#5F7A3D; --olive-soft:#EAF0DF;
    --amber:#D98E22; --amber-soft:#FBEFDC;
    --gray:#6C7A80; --danger:#B4432E;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Inter','Segoe UI',sans-serif;min-height:100vh}
  .disp{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em}
  header{background:var(--ink);color:#fff;padding:16px 0 14px}
  .hwrap,.shell{max-width:960px;margin:0 auto;padding:0 16px}
  .hwrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{background:#fff;color:var(--ink);font-weight:700;font-size:15px;padding:6px 10px;border-radius:8px}
  .shell{padding-bottom:90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  h1{font-size:26px;margin:22px 0 4px}
  .sub{color:var(--gray);font-size:14px;margin-bottom:16px}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:10px}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .empty{padding:24px;text-align:center;color:var(--gray);font-size:14px}
  /* login */
  .login{max-width:380px;margin:60px auto;padding:28px}
  .login h1{margin:0 0 4px;font-size:24px}
  .login p{color:var(--gray);font-size:13px;margin-bottom:18px}
  .login label{font-size:12px;font-weight:600;color:var(--gray);display:block;margin:12px 0 4px}
  .login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:14px}
  .login input:focus{outline:2px solid var(--petrol);border-color:var(--petrol)}
  .login .btn{width:100%;margin-top:18px;background:var(--petrol);color:#fff;padding:13px;font-size:14px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  /* week */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
  .daycell{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0 8px;text-align:center;cursor:pointer}
  .daycell.today{background:var(--petrol);border-color:var(--petrol);color:#fff}
  .daycell small{font-size:11px;font-weight:600;opacity:.7;display:block}
  .daycell b{font-size:20px;line-height:1.2}
  .daycell span{font-size:10px;display:block;margin-top:2px;opacity:.85}
  .summary{display:grid;gap:12px}
  .scard{padding:18px}
  .scard h2{font-size:18px;margin:10px 0 4px}
  .scard p{font-size:14px;color:var(--gray)}
  /* training */
  .ex{padding:16px;display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
  .ex.done{opacity:.65}
  .chk{width:30px;height:30px;border-radius:8px;flex-shrink:0;margin-top:2px;background:var(--paper);color:var(--gray);border:1px solid var(--line);cursor:pointer;font-size:15px}
  .ex.done .chk{background:var(--petrol);color:#fff;border-color:var(--petrol)}
  .exhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .exhead strong{font-size:15px}
  .sets{color:var(--petrol);font-size:14px;font-weight:600}
  .exnote{font-size:13px;color:var(--gray);margin:4px 0 8px}
  .demo-btn{background:var(--petrol-soft);color:var(--petrol);padding:7px 12px;font-size:12px}
  .finish{margin-top:6px;width:100%;background:var(--petrol);color:#fff;padding:14px;font-size:14px}
  .finish[disabled]{opacity:.5;cursor:default}
  /* menu */
  .daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .daytabs .btn{padding:8px 14px;font-size:13px;flex-shrink:0;background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .daytabs .btn.on{background:var(--olive);color:#fff;border-color:var(--olive)}
  .meal{padding:16px;margin-bottom:10px}
  .mealhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
  .mealhead strong{font-size:15px;color:var(--olive)}
  .macros{font-size:12px;color:var(--gray);font-weight:600}
  .meal p{font-size:14px;margin-top:6px}
  .daytotals{padding:12px 16px;display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--gray);margin-bottom:10px;background:var(--olive-soft);border:none}
  .daytotals b{color:var(--olive);font-size:14px}
  .ingtbl{margin-top:8px}
  .ingrow{display:grid;grid-template-columns:1fr 52px 52px 46px 46px 46px 46px;gap:4px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:center}
  .ingrow:last-child{border-bottom:none}
  .ingrow .nm{font-weight:600;font-size:13px}
  .ingrow span:not(.nm){text-align:right;color:var(--gray)}
  .inghead span{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--gray);font-weight:600}
  /* chat */
  .chatbox{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:320px;max-height:55vh;overflow-y:auto}
  .msg{max-width:82%}
  .msg .bubble{padding:10px 14px;font-size:14px;line-height:1.45;word-wrap:break-word}
  .msg.coach{align-self:flex-start}
  .msg.coach .bubble{background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px}
  .msg.me{align-self:flex-end}
  .msg.me .bubble{background:var(--petrol);color:#fff;border-radius:14px 14px 4px 14px}
  .msg .meta{font-size:11px;color:var(--gray);margin-top:3px}
  .msg.me .meta{text-align:right}
  .chatrow{display:flex;gap:8px;margin-top:10px}
  .chatrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:14px;background:var(--card)}
  .chatrow input:focus{outline:2px solid var(--petrol);border-color:var(--petrol)}
  .send{background:var(--petrol);color:#fff;padding:0 20px;font-size:14px}
  /* video */
  .callcard{padding:20px;border-top:4px solid var(--amber)}
  .callcard h2{font-size:22px;margin:12px 0 4px}
  .callcard p{font-size:14px;color:var(--gray);margin-bottom:4px}
  .join{margin-top:16px;background:var(--amber);color:#fff;padding:13px 26px;font-size:14px;letter-spacing:.05em;text-decoration:none;display:inline-block}
  .vframe{margin:14px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000}
  .vframe-inner{height:70vh;min-height:420px}
  .vclose{width:100%;background:var(--ink);color:#fff;padding:12px;font-size:13px;border-radius:0}
  .past{padding:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
  .past a{color:var(--petrol)}
  h3.past-h{font-size:15px;color:var(--gray);margin:22px 0 10px}
  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .navin{display:flex;max-width:960px;margin:0 auto}
  .navbtn{flex:1;border:none;background:none;cursor:pointer;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--gray);font-family:inherit}
  .navbtn .ico{font-size:17px}
  .navbtn.on{color:var(--petrol)}
  .logout{background:none;border:none;color:#fff;opacity:.6;font-size:12px;cursor:pointer;font-family:inherit;margin-top:4px}
  section[hidden],div[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ============ ТЪМНА БРАНД ТЕМА (NB Method) ============ */
  :root{--orange:#F97316}
  body{background:#0D1B21;color:#F0EDE4}
  header{background:#0A1A20}
  .card{background:#112B34;border-color:#24424D}
  .sub,.scard p,.exnote,.macros,.msg .meta,.empty,.ingrow span:not(.nm),.inghead span,.callcard p{color:#9FB0B5}
  .login input{background:#0E222A;border-color:#2A4652;color:#F0EDE4}
  .login p,.login label{color:#9FB0B5}
  .login .btn{background:var(--orange)}
  .err{color:#FFB4A0}
  .daycell{background:#112B34;border-color:#24424D;color:#F0EDE4}
  .daycell.today{background:var(--orange);border-color:var(--orange)}
  .pill[style*="petrol-soft"]{background:#143E4C!important;color:#FFA65C!important}
  .pill[style*="olive-soft"]{background:#22331B!important;color:#B9D48A!important}
  .pill[style*="amber-soft"]{background:#3D2C12!important;color:#FFA65C!important}
  button[style*="background:var(--ink)"]{background:var(--orange)!important}
  .chk{background:#0E222A;border-color:#2A4652;color:#9FB0B5}
  .ex.done .chk{background:var(--orange);border-color:var(--orange);color:#fff}
  .sets{color:#FFA65C}
  .demo-btn{background:rgba(237,106,47,.16);color:#FFA65C}
  .finish{background:var(--orange)}
  .daytabs .btn{background:#112B34;color:#F0EDE4;border-color:#24424D}
  .daytabs .btn.on{background:#5F7A3D;border-color:#5F7A3D;color:#fff}
  .daytotals{background:#16262B;color:#9FB0B5}
  .daytotals b{color:#B9D48A}
  .mealhead strong{color:#B9D48A}
  .tip{background:#16262B;color:#B9D48A}
  .msg.coach .bubble{background:#0E222A;border-color:#2A4652}
  .msg.me .bubble{background:#0F4C5C}
  .chatrow input{background:#0E222A;border-color:#2A4652;color:#F0EDE4}
  .send{background:var(--orange)}
  .join{background:var(--orange)}
  .past a{color:#FFA65C}
  .ingrow{border-bottom-color:#24424D}
  nav{background:#0A1A20;border-top-color:#24424D}
  .navbtn{color:#7E939A}
  .navbtn.on{color:var(--orange)}

  /* ===== видео плейър ===== */
  .vmodal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .vmodal video{max-width:100%;max-height:80vh;border-radius:12px;background:#000}
  .vmodal .vx{position:absolute;top:14px;right:16px;background:#F97316;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit}
  /* ===== седмични мерки ===== */
  .mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
  .mrow input{width:100%;border:1px solid #2A4652;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;background:#0E222A;color:#F0EDE4}
  .mrow input::placeholder{color:#7E939A}
  .prg-save{background:#F97316;color:#fff;width:100%;padding:12px;font-size:14px;margin-top:6px}
  .prgrow{display:grid;grid-template-columns:74px repeat(6,1fr);gap:4px;font-size:12px;padding:7px 0;border-bottom:1px dashed #24424D}
  .prgrow span{text-align:right;color:#9FB0B5}
  .prgrow span:first-child{text-align:left;font-weight:600;color:#F0EDE4}
  .prghead span{font-size:10px;text-transform:uppercase;color:#7E939A}
  .daycell.sel{outline:2px solid #F97316;outline-offset:-2px}
  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .weeknav .wn{background:#112B34;border:1px solid #24424D;color:#F0EDE4;padding:8px 18px;font-size:15px}
  .weeknav .wn[disabled]{opacity:.3;cursor:default}
  .finish,.send,.join,.prg-save,.login .btn,.daycell.today,.vmodal .vx{color:#FFFFFF !important}
  button[style*="background:var(--ink)"]{color:#FFFFFF !important}
  .shopbtn{width:100%;background:#112B34;border:1px solid #24424D;color:#F0EDE4;padding:12px;font-size:14px;margin-bottom:14px}
  .shoprow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #24424D;font-size:14px}
  .shoprow:last-child{border-bottom:none}
  .shoprow input[type=checkbox]{width:19px;height:19px;accent-color:var(--orange);flex-shrink:0}
  .shoprow.done label{opacity:.45;text-decoration:line-through}
  .shoprow label{flex:1;cursor:pointer}
  .shoprow .qty{color:#9FB0B5;font-size:13px}
  .phrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .phcell{flex-shrink:0;text-align:center}
  .phcell img{width:110px;height:150px;object-fit:cover;border-radius:10px;border:1px solid #24424D;cursor:pointer;background:#0E222A}
  .phcell small{display:block;margin-top:4px;font-size:11px;color:#9FB0B5}
</style>
</head>
<body>

<!-- ============ ЕКРАН: ВХОД ============ -->
<div id="screen-login">
  <div class="card login">
    <div class="logo disp" style="display:inline-block;margin-bottom:14px">NB</div>
    <h1 class="disp">NB Method</h1>
    <p>Персонален онлайн коучинг с Недко Богданов</p>
    <label for="email">Имейл</label>
    <input id="email" type="email" autocomplete="email">
    <label for="pass">Парола</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="btn" onclick="login()">Вход</button>
    <div class="err" id="loginerr"></div>
  </div>
</div>

<!-- ============ ЕКРАН: ПРИЛОЖЕНИЕ ============ -->
<div id="screen-app" hidden>
<header>
  <div class="hwrap">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo disp">NB</div>
      <div>
        <div class="disp" style="font-size:16px;font-weight:600">NB Method</div>
        <div style="font-size:12px;opacity:.65" id="coachname"></div>
      </div>
    </div>
    <div style="text-align:right">
      <div style="font-size:13px;font-weight:600" id="username"></div>
      <div style="font-size:11px;opacity:.65" id="programname"></div>
      <button class="logout" onclick="changePass()">Смяна на парола</button>
      <button class="logout" onclick="logout()">Изход</button>
    </div>
  </div>
</header>

<main class="shell">
  <section id="tab-week">
    <h1 class="disp">Твоята седмица</h1>
    <p class="sub" id="week-sub"></p>
    <div class="card" style="padding:14px 16px;margin-bottom:14px" id="mood-card">
      <div class="disp" style="font-size:14px;margin-bottom:10px">Как се чувстваш днес?</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="mood-btns"></div>
    </div>
    <div class="card" style="padding:14px 16px;margin-bottom:14px" id="habits-card" hidden>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <span class="disp" style="font-size:14px">Навици за днес</span>
        <span style="font-size:12px;color:#9FB0B5" id="habit-streak"></span>
      </div>
      <div id="habit-list"></div>
    </div>
    <div class="weeknav">
      <button class="btn wn" id="wn-old" onclick="switchWeek(1)">← По-стара</button>
      <span class="disp" id="wn-label" style="font-size:14px"></span>
      <button class="btn wn" id="wn-new" onclick="switchWeek(-1)">По-нова →</button>
    </div>
    <div class="week" id="weekstrip"></div>
    <div class="summary" id="summary"></div>
    <h3 class="disp" style="font-size:15px;color:#9FB0B5;margin:24px 0 10px">Мерки за тази седмица</h3>
    <div class="card" style="padding:16px">
      <div class="mrow">
        <input type="number" step="0.1" id="pw" placeholder="Тегло кг">
        <input type="number" step="0.1" id="pwa" placeholder="Талия см">
        <input type="number" step="0.1" id="pch" placeholder="Гърди см">
        <input type="number" step="0.1" id="phi" placeholder="Ханш см">
        <input type="number" step="0.1" id="pth" placeholder="Бедро см">
        <input type="number" step="0.1" id="par" placeholder="Ръка см">
      </div>
      <label style="display:block;font-size:12px;color:#9FB0B5;margin:4px 0 6px">📷 Снимка за тази седмица (по избор)</label>
      <input type="file" id="pphoto" accept="image/*" style="width:100%;color:#9FB0B5;font-size:13px">
      <button class="btn prg-save disp" onclick="saveProgress()">Запази мерките</button>
      <div class="err" id="prg-msg" style="text-align:center"></div>
    </div>
    <button class="btn shopbtn disp" style="margin-top:24px" onclick="openResultsWindow()">📊 Резултати — виж промяната</button>
    <div class="card" style="padding:16px;margin-bottom:4px" id="prg-chart"></div>
    <h3 class="disp" style="font-size:15px;color:#9FB0B5;margin:24px 0 10px">История</h3>
    <div class="card" style="padding:14px 16px" id="prg-history"></div>
    <h3 class="disp" style="font-size:15px;color:#9FB0B5;margin:24px 0 10px">Снимки по седмици</h3>
    <div class="card" style="padding:14px 16px" id="prg-photos"></div>
  </section>

  <section id="tab-training" hidden>
    <h1 class="disp" id="tr-title">Тренировка</h1>
    <p class="sub" id="tr-sub"></p>
    <div id="exlist"></div>
    <button class="btn disp finish" id="finishbtn" onclick="finishWorkout()">Приключи тренировката и изпрати отчет</button>
  </section>

  <section id="tab-menu" hidden>
    <h1 class="disp">Седмично меню</h1>
    <p class="sub" id="menu-sub"></p>
    <button class="btn shopbtn disp" onclick="openShopWindow()">🛒 Списък за пазаруване за седмицата</button>
    <div class="card" style="padding:16px;margin-bottom:14px" id="shoplist" hidden></div>
    <div class="daytabs" id="daytabs"></div>
    <div id="nb_meals"></div>
  </section>

  <section id="tab-chat" hidden>
    <h1 class="disp" style="margin-bottom:14px" id="chat-title">Чат</h1>
    <div class="card chatbox" id="chatbox"></div>
    <div class="empty" id="chat-hours" hidden style="padding:10px 14px;font-size:13px;text-align:left;background:#112B34;border:1px solid #24424D;border-radius:12px;margin-top:10px"></div>
    <div class="chatrow">
      <input id="chatin" placeholder="Напиши съобщение…" aria-label="Съобщение">
      <button class="btn send" onclick="sendMsg()">Изпрати</button>
    </div>
  </section>

  <section id="tab-video" hidden>
    <h1 class="disp" style="margin-bottom:14px">Видео разговори</h1>
    <div class="vframe" id="vframe" hidden>
      <div class="vframe-inner" id="vframe-inner"></div>
      <button class="btn vclose" onclick="endCall()">Затвори видео разговора</button>
    </div>
    <div id="nextcall"></div>
    <h3 class="disp past-h">Минали разговори</h3>
    <div id="pastcalls"></div>
  </section>
</main>

<nav aria-label="Основна навигация"><div class="navin" id="nav"></div></nav>
</div>

<script>
/* ============================================================
   НАСТРОЙКА — попълни от Supabase → Settings → API
   ============================================================ */
const SUPABASE_URL = "https://ncajmvrwueobqbiebphm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_alDMU4EFhjzX1-XgcvKN-A_Pa5Y_uXH";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
/* Часове, в които клиентите могат да пишат (българско време). null = без ограничение */
const CHAT_HOURS = { from: 8, to: 22 };

const DAYS = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const NAV = [["week","Седмица","▦"],["training","Тренировка","◆"],["menu","Хранене","◈"],["chat","Чат","◉"],["video","Видео","▶"]];
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const todayDow = () => ((new Date().getDay() + 6) % 7) + 1; // 1=Пн … 7=Нд

let me, program, plan, workouts = [], exercises = [], meals = [], mealItems = [], calls = [], msgs = [];
let selDay = todayDow(), selTrainDay = null, chatChannel = null;

/* ---------------- AUTH ---------------- */
async function login(){
  const err = document.getElementById("loginerr");
  err.textContent = "";
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("pass").value,
  });
  if (error) { err.textContent = "Грешен имейл или парола."; return; }
  boot();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }
document.getElementById("pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

/* ---------------- BOOT ---------------- */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return; // stay on login

  const { data: profile } = await sb.from("nb_profiles").select("*").eq("id", session.user.id).single();
  me = profile;

  if (me.role === "coach") {
    alert("Здравей, " + me.full_name + "! Треньорският панел е следващата стъпка от изграждането — този файл е клиентското приложение.");
    return;
  }

  // active program + coach name
  const { data: prog } = await sb.from("nb_client_programs")
    .select("*, coach:coach_id ( full_name )")
    .eq("client_id", me.id).eq("status", "active").maybeSingle();

  document.getElementById("screen-login").hidden = true;
  document.getElementById("screen-app").hidden = false;
  document.getElementById("username").textContent = me.full_name;

  if (!prog) {
    document.getElementById("summary").innerHTML =
      `<div class="card empty">Все още нямаш активна програма. Треньорът ти ще я активира скоро.</div>`;
    renderNav(); return;
  }
  program = prog;
  document.getElementById("coachname").textContent = "Треньор: " + (prog.coach?.full_name || "");
  document.getElementById("programname").textContent = `Програма: ${prog.program_name} · Седмица ${prog.current_week}`;
  document.getElementById("chat-title").textContent = "Чат с " + (prog.coach?.full_name?.split(" ")[0] || "треньора");
  document.getElementById("menu-sub").textContent = prog.daily_kcal_target
    ? `Цел: ~${prog.daily_kcal_target} ккал / ден` : "Изготвено от твоя треньор";

  const { data: allPlans } = await sb.from("nb_weekly_plans")
    .select("*").eq("program_id", program.id)
    .order("week_number", { ascending: false });
  plans = allPlans || [];
  planIdx = 0;
  plan = plans[0] || null;
  if (plan) await loadPlanData(plan.id);

  const { data: c } = await sb.from("nb_video_calls")
    .select("*").eq("program_id", program.id).order("scheduled_at", { ascending: false });
  calls = c || [];

  await loadChat();
  subscribeChat();

  renderNav(); renderWeek(); renderTraining(); renderMenu(); renderCalls(); loadProgress(); loadMood(); loadHabits();
}

/* ---------------- NAV ---------------- */
let tab = "week";
function go(t){
  tab = t;
  NAV.forEach(([id]) => document.getElementById("tab-" + id).hidden = id !== t);
  document.querySelectorAll(".navbtn").forEach((b,i) => b.classList.toggle("on", NAV[i][0] === t));
  window.scrollTo({ top: 0 });
  if (t === "chat") { markRead(); updateChatAvailability(); }
}
function renderNav(){
  document.getElementById("nav").innerHTML = NAV.map(([id,label,ico]) =>
    `<button class="navbtn${id===tab?" on":""}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join("");
}

/* ---------------- СЕДМИЦА ---------------- */
let plans = [], planIdx = 0, selWeekDay = null;

async function loadPlanData(pid){
  const [{ data: w }, { data: m }] = await Promise.all([
    sb.from("nb_workouts").select("*").eq("weekly_plan_id", pid).order("day_of_week"),
    sb.from("nb_meals").select("*").eq("weekly_plan_id", pid).order("day_of_week"),
  ]);
  workouts = w || []; meals = m || [];
  exercises = []; mealItems = [];
  const ids = workouts.map(x => x.id);
  if (ids.length) {
    const { data: ex } = await sb.from("nb_workout_exercises").select("*").in("workout_id", ids).order("position");
    exercises = ex || [];
  }
  const mids = meals.map(x => x.id);
  if (mids.length) {
    const { data: mi } = await sb.from("nb_meal_items").select("*").in("meal_id", mids).order("position");
    mealItems = mi || [];
  }
}

async function switchWeek(dir){
  const ni = planIdx + dir;
  if (ni < 0 || ni >= plans.length) return;
  planIdx = ni; plan = plans[ni];
  selWeekDay = null; selTrainDay = null;
  await loadPlanData(plan.id);
  renderWeek(); renderTraining(); renderMenu();
}

function isCurrentWeek(){
  if (!plan) return false;
  const s = new Date(plan.week_start + "T00:00:00");
  const e = new Date(s); e.setDate(s.getDate() + 7);
  const n = new Date();
  return n >= s && n < e;
}

function renderWeek(){
  const lbl = document.getElementById("wn-label");
  const bOld = document.getElementById("wn-old"), bNew = document.getElementById("wn-new");
  if (!plan) {
    lbl.textContent = ""; bOld.disabled = bNew.disabled = true;
    document.getElementById("week-sub").textContent = "";
    document.getElementById("weekstrip").innerHTML = "";
    document.getElementById("summary").innerHTML =
      `<div class="card empty">Треньорът още не е публикувал седмица — ще я видиш тук веднага щом е готова.</div>`;
    return;
  }
  bOld.disabled = planIdx >= plans.length - 1;
  bNew.disabled = planIdx <= 0;
  const start = new Date(plan.week_start + "T00:00:00");
  lbl.textContent = `Седмица ${plan.week_number} · от ${start.toLocaleDateString("bg-BG",{day:"numeric",month:"long"})}`;

  const doneCount = workouts.filter(w => w.completed_at).length;
  const trainCount = workouts.filter(w => w.workout_type !== "rest").length;
  document.getElementById("week-sub").textContent =
    `${doneCount} от ${trainCount} тренировки изпълнени` +
    (plan.coach_notes ? ` · 📝 ${plan.coach_notes}` : "");

  const cw = isCurrentWeek();
  const sel = selWeekDay ?? (cw ? todayDow() : 1);
  document.getElementById("weekstrip").innerHTML = DAYS.map((d, i) => {
    const date = new Date(start); date.setDate(start.getDate() + i);
    const dow = i + 1;
    const w = workouts.find(x => x.day_of_week === dow);
    const mark = w ? (w.completed_at ? "✓" : w.workout_type === "rest" ? "—" : "•") : "—";
    const cls = (cw && dow === todayDow() ? " today" : "") + (dow === sel ? " sel" : "");
    return `<div class="daycell${cls}" onclick="openDay(${dow})">
      <small>${d}</small><b class="disp">${date.getDate()}</b><span>${mark}</span></div>`;
  }).join("");

  const dayName = (cw && sel === todayDow()) ? "Днес" : DAYS[sel - 1];
  const tw = workouts.find(x => x.day_of_week === sel);
  const dayMeals = meals.filter(m => m.day_of_week === sel);
  const kcal = Math.round(dayMeals.reduce((s, m) => {
    const its = itemsOf(m.id);
    return s + (its.length ? sumItems(its).kcal : (+m.kcal || 0));
  }, 0));
  const next = calls.find(c => c.status === "scheduled" && new Date(c.scheduled_at) > new Date());

  document.getElementById("summary").innerHTML = `
    <div class="card scard" style="border-left:4px solid var(--petrol)">
      <span class="pill" style="background:var(--petrol-soft);color:var(--petrol)">Тренировка</span>
      <h2 class="disp">${dayName}: ${tw ? esc(tw.title) : "Няма планирана"}</h2>
      <p>${tw && tw.workout_type !== "rest" ? "Отвори я, отметни упражненията и я приключи." : "Почивен ден — движение с леко темпо е добра идея."}</p>
      ${tw && tw.workout_type !== "rest" ? `<button class="btn" onclick="openTraining(${sel})" style="margin-top:12px;background:var(--ink);color:#fff;padding:10px 18px;font-size:13px">Отвори тренировката →</button>` : ""}
    </div>
    <div class="card scard" style="border-left:4px solid var(--olive)">
      <span class="pill" style="background:var(--olive-soft);color:var(--olive)">Хранене</span>
      <h2 class="disp">${dayMeals.length ? `Меню · ${kcal} ккал` : "Няма меню"}</h2>
      <p>${dayMeals.length ? dayMeals.length + " хранения за " + dayName.toLowerCase() + "." : "Провери другите дни."}</p>
      ${dayMeals.length ? `<button class="btn" onclick="selDay=${sel};renderMenu();go('menu')" style="margin-top:12px;background:var(--ink);color:#fff;padding:10px 18px;font-size:13px">Виж менюто →</button>` : ""}
    </div>
    <div class="card scard" style="border-left:4px solid var(--amber)">
      <span class="pill" style="background:var(--amber-soft);color:var(--amber)">Видео разговор</span>
      <h2 class="disp">${next ? fmtDT(next.scheduled_at) : "Няма насрочен"}</h2>
      <p>${next ? esc(next.topic || "Седмичен преглед") : "Треньорът ще насрочи следващия разговор."}</p>
    </div>`;
}
function openDay(dow){ selWeekDay = dow; renderWeek(); }
function openTraining(dow){ selTrainDay = dow; renderTraining(); go("training"); }
function fmtDT(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("bg-BG",{day:"numeric",month:"long"}) + " · " +
         d.toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"});
}

/* ---------------- ТРЕНИРОВКА ---------------- */
function currentWorkout(){
  const dow = selTrainDay ?? todayDow();
  return workouts.find(w => w.day_of_week === dow && w.workout_type !== "rest")
      || workouts.find(w => w.workout_type !== "rest");
}
function renderTraining(){
  const w = currentWorkout();
  const list = document.getElementById("exlist");
  const btn = document.getElementById("finishbtn");
  if (!w) {
    document.getElementById("tr-title").textContent = "Тренировка";
    document.getElementById("tr-sub").textContent = "";
    list.innerHTML = `<div class="card empty">Няма тренировка за този ден.</div>`;
    btn.hidden = true; return;
  }
  const ex = exercises.filter(e => e.workout_id === w.id);
  const done = ex.filter(e => e.done).length;
  document.getElementById("tr-title").textContent = "Тренировка · " + DAYS[w.day_of_week - 1];
  document.getElementById("tr-sub").textContent =
    `${w.title}${w.est_minutes ? " · ~" + w.est_minutes + " мин" : ""} · ${done}/${ex.length} упражнения`;
  list.innerHTML = ex.length ? ex.map(e => `
    <div class="card ex${e.done?" done":""}">
      <button class="chk" aria-label="Отбележи упражнението" onclick="toggleEx('${e.id}')">${e.done?"✓":""}</button>
      <div style="flex:1;min-width:0">
        <div class="exhead"><strong>${esc(e.name)}</strong><span class="sets disp">${esc(e.sets_reps)}</span></div>
        <p class="exnote">${esc(e.coach_note || "")}${e.rest_seconds ? " · Почивка " + e.rest_seconds + " сек" : ""}</p>
        ${e.why_note ? `<p class="exnote" style="color:#FFA65C">💡 ${esc(e.why_note)}</p>` : ""}
        ${e.demo_video_url ? `<button class="btn demo-btn" data-u="${esc(e.demo_video_url)}" onclick="playDemo(this.dataset.u)">▶ Видео демонстрация</button>` : ""}
      </div>
    </div>`).join("") : `<div class="card empty">Няма добавени упражнения.</div>`;
  btn.hidden = !ex.length;
  btn.disabled = !!w.completed_at;
  btn.textContent = w.completed_at ? "✓ Тренировката е отчетена" : "Приключи тренировката и изпрати отчет";
}
async function toggleEx(id){
  const e = exercises.find(x => x.id === id);
  e.done = !e.done; renderTraining();
  await sb.from("nb_workout_exercises").update({ done: e.done }).eq("id", id);
}
async function finishWorkout(){
  const w = currentWorkout(); if (!w || w.completed_at) return;
  w.completed_at = new Date().toISOString(); renderTraining(); renderWeek();
  await sb.from("nb_workouts").update({ completed_at: w.completed_at }).eq("id", w.id);
  await sb.from("nb_messages").insert({
    program_id: program.id, sender_id: me.id,
    body: `✅ Приключих тренировката: ${w.title}`,
  });
}

/* ---------------- ХРАНЕНЕ ---------------- */
const SLOT_ORDER = ["закуска","втора закуска","обяд","втори обяд","след трен","междинно","вечеря"];
function slotIdx(s){ const i = SLOT_ORDER.indexOf((s || "").toLowerCase()); return i === -1 ? 99 : i; }
function cap(s){ s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }
function itemsOf(mealId){ return mealItems.filter(i => i.meal_id === mealId); }
function sumItems(list){
  const s = { kcal:0, carbs:0, fiber:0, fat:0, prot:0 };
  list.forEach(i => { s.kcal += +i.kcal || 0; s.carbs += +i.carbs_g || 0; s.fiber += +i.fiber_g || 0; s.fat += +i.fat_g || 0; s.prot += +i.protein_g || 0; });
  return s;
}
const r1 = v => Math.round(v * 1000) / 1000;

function renderMenu(){
  document.getElementById("daytabs").innerHTML = DAYS.map((d,i) =>
    `<button class="btn${i+1===selDay?" on":""}" onclick="pickDay(${i+1})">${d}</button>`).join("");
  const dm = meals.filter(m => m.day_of_week === selDay)
    .sort((a,b) => slotIdx(a.meal_slot) - slotIdx(b.meal_slot));

  if (!dm.length) {
    document.getElementById("nb_meals").innerHTML = `<div class="card empty">Няма меню за този ден.</div>`;
    return;
  }

  // дневни суми (от съставките; ако хранене няма съставки — от неговите kcal/protein)
  const day = { kcal:0, carbs:0, fiber:0, fat:0, prot:0 };
  dm.forEach(m => {
    const its = itemsOf(m.id);
    if (its.length) { const s = sumItems(its);
      day.kcal += s.kcal; day.carbs += s.carbs; day.fiber += s.fiber; day.fat += s.fat; day.prot += s.prot;
    } else { day.kcal += +m.kcal || 0; day.prot += +m.protein_g || 0; }
  });

  const totalsBar = `
    <div class="card daytotals">
      <span><b>${Math.round(day.kcal)}</b> ккал</span>
      <span>Въгл. <b>${r1(day.carbs)}</b> г</span>
      <span>Фибри <b>${r1(day.fiber)}</b> г</span>
      <span>Мазн. <b>${r1(day.fat)}</b> г</span>
      <span>Прот. <b>${r1(day.prot)}</b> г</span>
    </div>`;

  document.getElementById("nb_meals").innerHTML = totalsBar + dm.map(m => {
    const its = itemsOf(m.id);
    const s = its.length ? sumItems(its) : { kcal:+m.kcal||0, prot:+m.protein_g||0 };
    return `
    <div class="card meal">
      <div class="mealhead">
        <strong class="disp">${cap(esc(m.meal_slot))}${m.meal_time ? " · " + esc(m.meal_time) : ""}</strong>
        <span class="macros">${Math.round(s.kcal)} ккал · ${r1(s.prot)} г протеин</span>
      </div>
      ${its.length ? `
        <div class="ingtbl">
          <div class="ingrow inghead"><span>Съставка</span><span>гр/бр</span><span>ккал</span><span>В</span><span>Ф</span><span>М</span><span>П</span></div>
          ${its.map(i => `
            <div class="ingrow">
              <span class="nm">${esc(i.name)}</span>
              <span>${i.grams ?? "—"}</span>
              <span>${i.kcal != null ? Math.round(i.kcal) : "—"}</span>
              <span>${i.carbs_g != null ? r1(i.carbs_g) : "—"}</span>
              <span>${i.fiber_g != null ? r1(i.fiber_g) : "—"}</span>
              <span>${i.fat_g != null ? r1(i.fat_g) : "—"}</span>
              <span>${i.protein_g != null ? r1(i.protein_g) : "—"}</span>
            </div>`).join("")}
        </div>` : (m.description ? `<p>${esc(m.description)}</p>` : "")}
      ${m.link_url ? `<button class="btn demo-btn" style="margin-top:10px" data-u="${esc(m.link_url)}" onclick="playDemo(this.dataset.u)">▶ Рецепта / видео</button>` : ""}
    </div>`;
  }).join("");
}
function pickDay(d){ selDay = d; renderMenu(); }

  box.scrollTop = box.scrollHeight;
}

/* ---------------- ТЯЛО ПО МЕРКИТЕ ---------------- */
function bodyFromMeasures(logs, which){
  const pick = key => {
    const src = which === "first" ? logs : [...logs].reverse();
    const row = src.find(l => l[key] != null);
    return row ? +row[key] : null;
  };
  // мерки в см → полуширини в SVG единици (обиколка/π ≈ диаметър, после мащаб)
  const scale = 0.62;
  const half = (cm, fallback) => cm ? (cm / Math.PI) * scale : fallback;
  const chest = half(pick("chest_cm"), 34);
  const waist = half(pick("waist_cm"), 27);
  const hips  = half(pick("hips_cm"),  33);
  const thigh = half(pick("thigh_cm"), 17) * 1.15;
  const arm   = half(pick("arm_cm"), 9) * 0.9;
  const cx = 130;
  const legGap = 4;

  // торс: рамене → гърди(112) → талия(152) → ханш(186)
  const torso =
    `M${cx - chest},96` +
    ` C${cx - chest - 3},112 ${cx - waist - 6},136 ${cx - waist},152` +
    ` C${cx - waist + 1},166 ${cx - hips - 2},176 ${cx - hips},186` +
    ` L${cx + hips},186` +
    ` C${cx + hips + 2},176 ${cx + waist - 1},166 ${cx + waist},152` +
    ` C${cx + waist + 6},136 ${cx + chest + 3},112 ${cx + chest},96 Z`;
  // крака: от ханша надолу, ширина от бедрото
  const legL = `M${cx - hips + 2},186 C${cx - thigh - legGap - 6},230 ${cx - thigh - legGap},270 ${cx - legGap - 7},312 L${cx - legGap},312 C${cx - legGap + 2},268 ${cx - legGap + 1},226 ${cx - 2},190 Z`;
  const legR = `M${cx + hips - 2},186 C${cx + thigh + legGap + 6},230 ${cx + thigh + legGap},270 ${cx + legGap + 7},312 L${cx + legGap},312 C${cx + legGap - 2},268 ${cx + legGap - 1},226 ${cx + 2},190 Z`;
  // ръце: покрай торса, ширина от мярката на ръката
  const armL = `M${cx - chest - 2},100 C${cx - chest - arm - 8},130 ${cx - chest - arm - 6},158 ${cx - chest - arm + 1},182 L${cx - chest - arm + arm * 1.4},180 C${cx - chest - 4},150 ${cx - chest - 2},124 ${cx - chest + 2},104 Z`;
  const armR = `M${cx + chest + 2},100 C${cx + chest + arm + 8},130 ${cx + chest + arm + 6},158 ${cx + chest + arm - 1},182 L${cx + chest + arm - arm * 1.4},180 C${cx + chest + 4},150 ${cx + chest + 2},124 ${cx + chest - 2},104 Z`;
  const head = `<circle cx="${cx}" cy="34" r="20"/><path d="M${cx - 7},53 h14 v10 h-14 z"/>` +
    `<path d="M${cx - chest},96 C${cx - chest + 6},84 ${cx + chest - 6},84 ${cx + chest},96 Z"/>`;

  const style = which === "first"
    ? `fill="none" stroke="#5A6B72" stroke-width="2" stroke-dasharray="5 4"`
    : `fill="#1C3B47" stroke="#F97316" stroke-width="1.5"`;
  const headStyle = which === "first" ? `fill="none" stroke="#5A6B72" stroke-width="2"` : `fill="#1C3B47"`;

  return `<g ${which === "first" ? 'opacity="0.8"' : ''}>
    <g ${headStyle}>${which === "last" ? head : ""}</g>
    <path d="${torso}" ${style}/>
    <path d="${legL}" ${style}/><path d="${legR}" ${style}/>
    <path d="${armL}" ${style}/><path d="${armR}" ${style}/>
  </g>`;
}

    configOverwrite: { prejoinConfig: { enabled: false }, defaultLanguage: "bg" },
  });

async function saveProgress(){

  const msg = document.getElementById("prg-msg");

  const ph = document.getElementById("pphoto");

    const ext = (f.name.split(".").pop() || "jpg").toLowerCase();
    photoPath = me.id + "/" + weekMonday() + "." + ext;

  const { error } = await sb.from("nb_progress_logs").upsert({
    program_id: program.id, week_start: weekMonday(), logged_at: new Date().toISOString().slice(0,10),
    weight_kg: num("pw"), waist_cm: num("pwa"), chest_cm: num("pch"),

    ...(photoPath ? { photo_url: photoPath } : {}),

  msg.style.color = error ? "#FFB4A0" : "#B9D48A";
  msg.textContent = error ? "Грешка: " + error.message : "Записано ✓";

}

      <label for="hb-${h.id}">${h.icon || "✅"} ${esc(h.title)}</label>
    </div>`;
  }).join("");
  let streak = 0;
  for (let i = 0; i < 60; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = dstr(d);
    const all = habits.every(h => habitLogs.some(l => l.habit_id === h.id && l.day === ds && l.done));
    if (all) streak++;
    else if (i === 0) continue;
    else break;
  }
  document.getElementById("habit-streak").textContent = streak > 0 ? `🔥 Серия: ${streak} ${streak === 1 ? "ден" : "дни"}` : "";
}
async function tickHabit(id, done){
  const today = dstr(new Date());
  habitLogs = habitLogs.filter(l => !(l.habit_id === id && l.day === today));
  habitLogs.push({ habit_id: id, day: today, done });
  renderHabits();
  await sb.from("nb_habit_logs").upsert({ habit_id: id, day: today, done }, { onConflict: "habit_id,day" });
}

/* ---------------- СПИСЪК ЗА ПАЗАРУВАНЕ ---------------- */
let shopChecked = {};
function toggleShop(){
  const el = document.getElementById("shoplist");
  el.hidden = !el.hidden;
  if (!el.hidden) renderShop();
}
function shopAgg(){
  const agg = {};
  mealItems.forEach(i => {
    const key = i.name.trim().toLowerCase();
    if (!agg[key]) agg[key] = { name: i.name.trim(), grams: 0, count: 0 };
    if (i.grams != null) agg[key].grams += +i.grams; else agg[key].count += 1;
  });
  return Object.values(agg).sort((a, b) => a.name.localeCompare(b.name, "bg"));
}
const shopQty = r => r.grams > 0
  ? (r.grams >= 1000 ? (Math.round(r.grams / 100) / 10) + " кг" : Math.round(r.grams) + " г")
  : r.count + " бр/дози";
function renderShop(){
  const el = document.getElementById("shoplist");
  const rows = shopAgg();
  if (!rows.length) {
    el.innerHTML = `<div class="empty" style="padding:8px">Няма съставки в менюто за тази седмица.</div>`;
    return;
  }
  el.innerHTML = `<div class="disp" style="font-size:13px;color:#9FB0B5;margin-bottom:8px">
      Седмица ${plan ? plan.week_number : ""} · ${rows.length} продукта</div>` +
    rows.map((r, i) => `<div class="shoprow${shopChecked[r.name] ? " done" : ""}">
        <input type="checkbox" id="shop-${i}"${shopChecked[r.name] ? " checked" : ""} onchange="shopChecked['${r.name.replace(/'/g, "\\'")}']=this.checked;renderShop()">
        <label for="shop-${i}">${esc(r.name)}</label>
        <span class="qty">${shopQty(r)}</span>
      </div>`).join("") +
    `<button class="btn" style="margin-top:12px;background:#112B34;border:1px solid #24424D;color:#F0EDE4;padding:9px 14px;font-size:13px" onclick="copyShop()">📋 Копирай списъка</button>`;
}
function copyShop(){
  const text = shopAgg().map(r => "• " + r.name + " — " + shopQty(r)).join("\n");
  navigator.clipboard.writeText("Списък за пазаруване · NB Method\n" + text)
    .then(() => alert("Списъкът е копиран — пейстни го в Бележки или го прати на когото пазарува 🙂"))
    .catch(() => alert("Копирането не сработи — маркирай и копирай ръчно."));
}

/* ---------------- СНИМКИ ПО СЕДМИЦИ ---------------- */
async function renderPhotos(){
  const el = document.getElementById("prg-photos");
  const withPh = progress.filter(p => p.photo_url).sort((a,b) => a.week_start < b.week_start ? -1 : 1);
  if (!withPh.length) {
    el.innerHTML = `<div class="empty" style="padding:8px">Качи първата си снимка при мерките — след месец сравнението ще те мотивира повече от всичко. 📈</div>`;
    return;
  }
  const { data: signed } = await sb.storage.from("progress")
    .createSignedUrls(withPh.map(p => p.photo_url), 3600);
  const urls = {}; (signed || []).forEach(s => { if (s.signedUrl) urls[s.path] = s.signedUrl; });
  el.innerHTML = `<div class="phrow">` + withPh.map(p => `
    <div class="phcell">
      <img src="${urls[p.photo_url] || ""}" loading="lazy" alt="Снимка" onclick="openPhoto(this.src)">
      <small>${new Date(p.week_start).toLocaleDateString("bg-BG",{day:"numeric",month:"short"})}${p.weight_kg ? " · " + p.weight_kg + " кг" : ""}</small>
    </div>`).join("") + `</div>`;
}
function openPhoto(src){
  const m = document.createElement("div");
  m.className = "vmodal";
  m.innerHTML = `<button class="vx" onclick="this.parentNode.remove()">Затвори ✕</button>
                 <img src="${src}" style="max-width:100%;max-height:85vh;border-radius:12px">`;
  m.addEventListener("click", ev => { if (ev.target === m) m.remove(); });
  document.body.appendChild(m);
}

/* ---------------- СМЯНА НА ПАРОЛА ---------------- */
async function changePass(){
  const p1 = prompt("Нова парола (минимум 8 знака):");
  if (p1 === null) return;
  if (p1.length < 8) { alert("Паролата трябва да е поне 8 знака."); return; }
  const p2 = prompt("Повтори новата парола:");
  if (p1 !== p2) { alert("Паролите не съвпадат."); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  alert(error ? "Грешка: " + error.message : "Паролата е сменена успешно ✓");
}

/* ---------------- ЧАСОВЕ НА ЧАТА ---------------- */
function sofiaNow(){
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Sofia", hour: "2-digit", minute: "2-digit", hour12: false
  }).format(new Date());
  const [h, m] = parts.split(":").map(Number);
  return { h, m, text: parts };
}
function chatOpen(){
  if (!CHAT_HOURS) return true;
  const h = sofiaNow().h;
  return CHAT_HOURS.from < CHAT_HOURS.to
    ? (h >= CHAT_HOURS.from && h < CHAT_HOURS.to)
    : (h >= CHAT_HOURS.from || h < CHAT_HOURS.to);
}
function updateChatAvailability(){
  const open = chatOpen();
  const inp = document.getElementById("chatin");
  const btn = document.querySelector(".send");
  const note = document.getElementById("chat-hours");
  inp.disabled = !open; btn.disabled = !open;
  inp.placeholder = open ? "Напиши съобщение…" : "Чатът е затворен в момента";
  note.hidden = open;
  if (!open) {
    note.innerHTML = `💤 Недко приема съобщения от <b>${CHAT_HOURS.from}:00 до ${CHAT_HOURS.to}:00 българско време</b> (в момента там е ${sofiaNow().text}). Можеш спокойно да четеш плана и да отчиташ тренировки — пиши му, щом чатът отвори.`;
  }
}
